databaseChangeLog:
  - changeSet:
      id: 003-create-credential-with-audit
      author: Asa Wegelius
      validCheckSum: ANY
      changes:
        # Main table
        - createTable:
            tableName: credential
            columns:
              - column:
                  name: credential_id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: credential_type
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: secret_hash
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            constraintName: fk_credential_user
            baseTableName: credential
            baseColumnNames: user_id
            referencedTableName: "user"
            referencedColumnNames: user_id
            onDelete: CASCADE

        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              ALTER TABLE credential
              ADD CONSTRAINT chk_credential_type
              CHECK (credential_type = 'PASSWORD');

        - createIndex:
            tableName: credential
            indexName: idx_credential_user_id
            columns:
              - column:
                  name: user_id

        - addUniqueConstraint:
            tableName: credential
            constraintName: uq_credential_user_id_type
            columnNames: user_id, credential_type

        # Audit table
        - createTable:
            tableName: credential_audit
            columns:
              - column:
                  name: audit_id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: credential_id
                  type: UUID
              - column:
                  name: credential_type
                  type: VARCHAR(32)
              - column:
                  name: secret_hash
                  type: TEXT
              - column:
                  name: user_id
                  type: UUID
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
              - column:
                  name: operation_type
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: change_timestamp
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: actor_type
                  type: VARCHAR(16)
              - column:
                  name: actor_id
                  type: UUID

        - createIndex:
            tableName: credential_audit
            indexName: idx_credential_audit_credential_id
            columns:
              - column:
                  name: credential_id

        # Trigger function
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              CREATE OR REPLACE FUNCTION audit_credential_changes() RETURNS TRIGGER AS $$
              BEGIN
                INSERT INTO credential_audit (
                  credential_id,
                  credential_type,
                  secret_hash,
                  user_id,
                  created_at,
                  updated_at,
                  operation_type,
                  change_timestamp,
                  actor_type,
                  actor_id
                ) VALUES (
                  COALESCE(NEW.credential_id, OLD.credential_id),
                  COALESCE(NEW.credential_type, OLD.credential_type),
                  COALESCE(NEW.secret_hash, OLD.secret_hash),
                  COALESCE(NEW.user_id, OLD.user_id),
                  COALESCE(NEW.created_at, OLD.created_at),
                  COALESCE(NEW.updated_at, OLD.updated_at),
                  TG_OP,
                  now(),
                  NULL,
                  NULL
                );
                RETURN NEW;
              END;
              $$ LANGUAGE plpgsql;

        # Trigger
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              CREATE TRIGGER trg_credential_audit
              AFTER INSERT OR UPDATE OR DELETE
              ON credential
              FOR EACH ROW
              EXECUTE FUNCTION audit_credential_changes();
