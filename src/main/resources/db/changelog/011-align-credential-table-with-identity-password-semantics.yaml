databaseChangeLog:
  - changeSet:
      id: 011-align-credential-table-with-identity-password-semantics
      author: Asa Wegelius
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        - columnExists:
            tableName: credential
            columnName: secret_value
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              DELETE FROM credential
              WHERE user_id IS NULL OR client_id IS NOT NULL;

        - dropForeignKeyConstraint:
            baseTableName: credential
            constraintName: fk_credential_client

        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              ALTER TABLE credential
              DROP CONSTRAINT chk_user_or_client;

        - dropIndex:
            tableName: credential
            indexName: idx_credential_client_id

        - dropIndex:
            tableName: credential
            indexName: idx_credential_credential_id

        - dropColumn:
            tableName: credential
            columnName: expires_at

        - dropColumn:
            tableName: credential
            columnName: client_id

        - renameColumn:
            tableName: credential
            oldColumnName: secret_value
            newColumnName: secret_hash
            columnDataType: TEXT

        - addColumn:
            tableName: credential
            columns:
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false

        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              UPDATE credential
              SET credential_type = UPPER(credential_type),
                  updated_at = created_at;

        - addNotNullConstraint:
            tableName: credential
            columnName: user_id
            columnDataType: UUID

        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              ALTER TABLE credential
              ADD CONSTRAINT chk_credential_type
              CHECK (credential_type = 'PASSWORD');

        - addUniqueConstraint:
            tableName: credential
            constraintName: uq_credential_user_id_type
            columnNames: user_id, credential_type

        - renameColumn:
            tableName: credential_audit
            oldColumnName: secret_value
            newColumnName: secret_hash
            columnDataType: TEXT

        - addColumn:
            tableName: credential_audit
            columns:
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ

        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              UPDATE credential_audit
              SET credential_type = UPPER(credential_type),
                  updated_at = COALESCE(created_at, change_timestamp, now());

        - dropColumn:
            tableName: credential_audit
            columnName: expires_at

        - dropColumn:
            tableName: credential_audit
            columnName: client_id

        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              CREATE OR REPLACE FUNCTION audit_credential_changes() RETURNS TRIGGER AS $$
              BEGIN
                INSERT INTO credential_audit (
                  credential_id,
                  credential_type,
                  secret_hash,
                  user_id,
                  created_at,
                  updated_at,
                  operation_type,
                  change_timestamp,
                  actor_type,
                  actor_id
                ) VALUES (
                  COALESCE(NEW.credential_id, OLD.credential_id),
                  COALESCE(NEW.credential_type, OLD.credential_type),
                  COALESCE(NEW.secret_hash, OLD.secret_hash),
                  COALESCE(NEW.user_id, OLD.user_id),
                  COALESCE(NEW.created_at, OLD.created_at),
                  COALESCE(NEW.updated_at, OLD.updated_at),
                  TG_OP,
                  now(),
                  NULL,
                  NULL
                );
                RETURN NEW;
              END;
              $$ LANGUAGE plpgsql;
